name: Apply uploaded project archive

on:
  push:
    branches:
      - agent/import-uploaded-snapshot
    paths:
      - .snapshot/APPLY

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out update branch
        uses: actions/checkout@v4
        with:
          ref: agent/import-uploaded-snapshot
          fetch-depth: 0

      - name: Download and validate archive
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/haveno-markets-main.zip
          extract=/tmp/haveno-markets-upload
          curl --fail --location --retry 4 --retry-all-errors \
            'https://github.com/user-attachments/files/30398584/haveno-markets-main.zip' \
            --output "$archive"
          echo '8784847711b46801b78549ed0ae9ee6a93db03e5fa6470d122981898c5df22ee  /tmp/haveno-markets-main.zip' | sha256sum --check --strict
          rm -rf "$extract"
          mkdir -p "$extract"
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          archive = Path('/tmp/haveno-markets-main.zip')
          target = Path('/tmp/haveno-markets-upload')

          with ZipFile(archive) as zf:
              members = zf.infolist()
              if not members:
                  raise SystemExit('Archive is empty')
              for member in members:
                  path = PurePosixPath(member.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'Unsafe archive path: {member.filename}')
                  file_type = (member.external_attr >> 16) & 0o170000
                  if file_type == 0o120000:
                      raise SystemExit(f'Symlink is not permitted: {member.filename}')
              zf.extractall(target)

          roots = [path for path in target.iterdir() if path.is_dir()]
          if len(roots) != 1:
              raise SystemExit(f'Expected one project root, found {len(roots)}')
          root = roots[0]
          if not (root / 'package.json').is_file():
              raise SystemExit('package.json is missing from project root')
          PY

      - name: Replace branch contents
        shell: bash
        run: |
          set -euo pipefail
          source_root="$(find /tmp/haveno-markets-upload -mindepth 1 -maxdepth 1 -type d -print -quit)"
          rsync -a --delete --exclude='.git/' "$source_root/" ./
          git config user.name 'privacyOG'
          git config user.email '102720550+privacyOG@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Import uploaded project snapshot'
          git push origin HEAD:agent/import-uploaded-snapshot
